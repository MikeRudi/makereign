<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Imprint Engine — A brand partner for global teams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Allura&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/primitives.jsx"></script>
  <script type="text/babel" src="components/shell.jsx"></script>
  <script type="text/babel" src="pages/home.jsx"></script>
  <script type="text/babel" src="pages/services.jsx"></script>
  <script type="text/babel" src="pages/work.jsx"></script>
  <script type="text/babel" src="pages/about.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [route, setRoute] = useState(() => {
        const h = (window.location.hash || "").replace("#", "");
        return ["home","services","work","about"].includes(h) ? h : "home";
      });
      const [contactOpen, setContactOpen] = useState(false);

      const navigate = (r) => {
        setRoute(r);
        window.history.replaceState(null, "", `#${r}`);
        window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
      };

      useEffect(() => {
        const onHash = () => {
          const h = (window.location.hash || "").replace("#", "");
          if (["home","services","work","about"].includes(h)) setRoute(h);
        };
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);

      const openContact = () => setContactOpen(true);
      const closeContact = () => setContactOpen(false);

      return (
        <>
          <Nav route={route} navigate={navigate} openContact={openContact} />
          <main key={route}>
            {route === "home"     && <HomePage     openContact={openContact} navigate={navigate} />}
            {route === "services" && <ServicesPage openContact={openContact} navigate={navigate} />}
            {route === "work"     && <WorkPage     openContact={openContact} navigate={navigate} />}
            {route === "about"    && <AboutPage    openContact={openContact} navigate={navigate} />}
          </main>
          <Footer navigate={navigate} openContact={openContact} />
          <ContactModal open={contactOpen} onClose={closeContact} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
