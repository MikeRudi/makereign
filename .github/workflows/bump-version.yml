name: Bump version.txt (numeric counter)

on:
  push:
    branches:
      - main
    # Ignore changes that are only to version.txt so the workflow won't loop
    paths-ignore:
      - 'version.txt'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Increment version number
        run: |
          # read existing version (default to 0 if missing or invalid)
          if [ -f version.txt ]; then
            v=$(cat version.txt 2>/dev/null || echo 0)
          else
            v=0
          fi
          # ensure it's numeric
          v=$((v + 1))
          echo "$v" > version.txt
          git add version.txt
          git commit -m "ci: bump version to $v" || echo "No commit needed"
          git push origin HEAD:main
